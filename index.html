<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剪刀石頭布｜終極大對決</title>
<style>
  :root { --ink:#24304a; --purple:#7057d9; --pink:#ff729b; --mint:#dff8ed; --paper:#fffdf8; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:24px 14px;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    color:var(--ink);
    background: radial-gradient(circle at 10% 10%, #ffe2ed 0, transparent 28%),
                radial-gradient(circle at 90% 85%, #d8f8eb 0, transparent 30%),
                #f1efff;
    display:flex; align-items:center; justify-content:center;
  }
  .game { width:min(720px,100%); background:var(--paper); border:3px solid #24304a; border-radius:28px; padding:clamp(18px,4vw,34px); box-shadow:8px 8px 0 #24304a; }
  .tag { display:inline-block; background:#ffed9b; border:2px solid var(--ink); border-radius:999px; padding:6px 12px; font-size:13px; font-weight:900; transform:rotate(-2deg); }
  h1 { font-size:clamp(27px,5vw,42px); margin:14px 0 6px; line-height:1.2; }
  .sub { color:#68718a; margin:0 0 22px; }
  .setup { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px; }
  label { display:block; font-size:13px; font-weight:800; margin-bottom:6px; }
  input { width:100%; border:2px solid #d7d8e8; border-radius:12px; padding:12px; font:inherit; outline:none; background:white; }
  input:focus { border-color:var(--purple); }
  .welcome { background:#f0edff; border-radius:16px; padding:13px 15px; margin-bottom:18px; line-height:1.6; }
  .scoreboard { display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; margin:18px 0; }
  .score { background:white; border:2px solid var(--ink); border-radius:18px; padding:14px 8px; }
  .score .number { font-size:clamp(30px,7vw,44px); font-weight:1000; line-height:1.15; }
  .score .name { font-weight:800; overflow-wrap:anywhere; }
  .vs { font-weight:1000; color:var(--pink); }
  .arena { border:2px dashed #c9c4ee; border-radius:20px; padding:16px; text-align:center; background:#fcfbff; }
  .hands { display:flex; justify-content:center; align-items:center; gap:clamp(14px,7vw,48px); margin:10px 0; }
  .hand { font-size:clamp(52px,12vw,78px); min-width:80px; }
  .hand small { display:block; font-size:12px; font-weight:800; }
  .result { font-size:20px; font-weight:1000; min-height:30px; margin:8px 0 2px; }
  .hint { font-size:13px; color:#747b91; min-height:20px; }
  .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
  button { cursor:pointer; font:inherit; font-weight:900; border:2px solid var(--ink); border-radius:16px; padding:13px 6px; color:var(--ink); background:white; box-shadow:0 4px 0 var(--ink); transition:transform .12s, box-shadow .12s; }
  button:hover { transform:translateY(-2px); box-shadow:0 6px 0 var(--ink); }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
  button:disabled { opacity:.45; cursor:not-allowed; transform:none; box-shadow:none; }
  .choice-emoji { display:block; font-size:34px; margin-bottom:4px; }
  .bottom { display:flex; gap:10px; margin-top:18px; }
  .bottom button { flex:1; }
  .reset { background:#ffed9b; }
  .status { text-align:center; font-size:13px; color:#777d91; margin-top:14px; }
  @media(max-width:480px) { .setup {grid-template-columns:1fr;} .game {border-radius:22px;} .bottom {flex-direction:column;} }
</style>
</head>
<body>
<main class="game">
  <span class="tag">冒險者挑戰 · 第 1 關</span>
  <h1>✊✋✌️ 剪刀石頭布</h1>
  <p class="sub">終極大對決！先拿下 3 勝，就能成為猜拳大師。</p>

  <section class="setup">
    <div><label for="playerName">🧙 冒險者名字</label><input id="playerName" maxlength="18" placeholder="輸入你的名字" value="勇敢的冒險者"></div>
    <div><label for="equipment">🎒 使用裝備</label><input id="equipment" maxlength="24" placeholder="例如：魔法魔杖" value="魔法魔杖"></div>
  </section>
  <div class="welcome" id="welcome">歡迎勇敢的冒險者【勇敢的冒險者】！<br>你已經裝備了【魔法魔杖】，準備好迎接猜拳挑戰！</div>

  <div class="scoreboard">
    <div class="score"><div class="name" id="playerLabel">你</div><div class="number" id="playerScore">0</div><div>🏆 勝場</div></div>
    <div class="vs">VS</div>
    <div class="score"><div class="name">🤖 電腦</div><div class="number" id="computerScore">0</div><div>🏆 勝場</div></div>
  </div>

  <section class="arena" aria-live="polite">
    <div style="font-weight:900" id="roundLabel">第 1 回合</div>
    <div class="hands">
      <div class="hand"><div id="playerHand">❔</div><small id="playerHandLabel">你出拳</small></div>
      <div style="font-size:20px;font-weight:1000;color:#b2a8e8">✦</div>
      <div class="hand"><div id="computerHand">❔</div><small>電腦出拳</small></div>
    </div>
    <div class="result" id="result">準備好了嗎？選一個出拳吧！</div>
    <div class="hint" id="hint">剪刀贏布、石頭贏剪刀、布贏石頭。</div>
  </section>

  <div class="choices">
    <button class="choice" data-choice="剪刀"><span class="choice-emoji">✌️</span>剪刀</button>
    <button class="choice" data-choice="石頭"><span class="choice-emoji">✊</span>石頭</button>
    <button class="choice" data-choice="布"><span class="choice-emoji">✋</span>布</button>
  </div>
  <div class="bottom">
    <button id="updateInfo">更新冒險者資料</button>
    <button class="reset" id="reset">🔄 重新挑戰</button>
  </div>
  <div class="status">小提醒：平手不加分，任一方先到 3 勝就結束。</div>
</main>
<script>
const $ = id => document.getElementById(id);
const emoji = {剪刀:"✌️", 石頭:"✊", 布:"✋"};
let playerWins = 0, computerWins = 0, round = 1, finished = false;

function updateWelcome() {
  const name = $("playerName").value.trim() || "冒險者";
  const equipment = $("equipment").value.trim() || "神祕裝備";
  $("playerLabel").textContent = name;
  $("welcome").innerHTML = `歡迎勇敢的冒險者【${escapeHtml(name)}】！<br>你已經裝備了【${escapeHtml(equipment)}】，準備好迎接猜拳挑戰！`;
}
function escapeHtml(value) {
  return value.replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function play(player) {
  if (finished) return;
  const options = ["剪刀", "石頭", "布"];
  const computer = options[Math.floor(Math.random() * options.length)];
  $("playerHand").textContent = emoji[player];
  $("computerHand").textContent = emoji[computer];
  $("playerHandLabel").textContent = "你出了：" + player;
  $("roundLabel").textContent = `第 ${round} 回合`;
  let message;
  if (player === computer) {
    message = "🤝 平手！這回合沒有人得分。";
  } else if ((player === "剪刀" && computer === "布") ||
             (player === "石頭" && computer === "剪刀") ||
             (player === "布" && computer === "石頭")) {
    playerWins++;
    message = "🎉 這回合你贏了！";
  } else {
    computerWins++;
    message = "💥 這回合電腦贏了！";
  }
  $("playerScore").textContent = playerWins;
  $("computerScore").textContent = computerWins;
  $("result").textContent = message;
  round++;
  if (playerWins === 3 || computerWins === 3) {
    finished = true;
    $("result").textContent = playerWins === 3
      ? `🏆 恭喜 ${$("playerName").value.trim() || "冒險者"} 獲勝！你是猜拳大師！`
      : `🤖 電腦以 ${computerWins}：${playerWins} 獲得最終勝利，再接再厲！`;
    $("hint").textContent = "按「重新挑戰」再玩一場！";
    document.querySelectorAll(".choice").forEach(button => button.disabled = true);
  } else {
    $("hint").textContent = `目前戰況：你 ${playerWins} 勝，電腦 ${computerWins} 勝。`;
  }
}
function resetGame() {
  playerWins = 0; computerWins = 0; round = 1; finished = false;
  $("playerScore").textContent = "0"; $("computerScore").textContent = "0";
  $("roundLabel").textContent = "第 1 回合";
  $("playerHand").textContent = "❔"; $("computerHand").textContent = "❔";
  $("playerHandLabel").textContent = "你出拳";
  $("result").textContent = "準備好了嗎？選一個出拳吧！";
  $("hint").textContent = "剪刀贏布、石頭贏剪刀、布贏石頭。";
  document.querySelectorAll(".choice").forEach(button => button.disabled = false);
}
document.querySelectorAll(".choice").forEach(button => button.addEventListener("click", () => play(button.dataset.choice)));
$("updateInfo").addEventListener("click", updateWelcome);
$("reset").addEventListener("click", resetGame);
$("playerName").addEventListener("change", updateWelcome);
$("equipment").addEventListener("change", updateWelcome);
</script>
</body>
</html>
